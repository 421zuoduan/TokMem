[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tokmem-toolathlon"
version = "0.1.0"
description = "Toolathlon-Verified integration for TokMem and TapMem"
requires-python = ">=3.10"
dependencies = [
    "jsonschema==4.25.1",
]

[project.optional-dependencies]
runtime = [
    "mcp==1.9.0",
    "openai==1.76.0",
]

[tool.setuptools]
packages = ["compositional_toolathlon"]
package-dir = {"compositional_toolathlon" = "."}

[tool.setuptools.package-data]
compositional_toolathlon = [
    "configs/*.json",
    "prompts/*.txt",
]
